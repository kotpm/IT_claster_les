<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтернет-магазин — лабораторна робота №4</title>
    <link rel="stylesheet" href="style.css">
    <script src="import-export.js" defer></script>
    <script src="data.js" defer></script>
    <script src="validation.js" defer></script>
    <script src="forms.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Предметна область — інтернет-магазин</h1>
        <p>Інформація про товари, покупців і замовлення</p>
    </header>
    <main>
        <button type="button" onclick="showTable('products')">Товари</button>
        <button type="button" onclick="showTable('customers')">Покупці</button>
        <button type="button" onclick="showTable('orders')">Замовлення</button>
        <div id="table-container" class="table-container"></div>
        <p id="message" role="status" aria-live="polite"></p>
       
    </main>
    <dialog id="edit-dialog">
        <form id="edit-form">
            <h3 id="edit-title"></h3>
            <div id="edit-field"></div>
            <button type="submit">Зберегти</button>
            <button type="button" onclick="document.getElementById('edit-dialog').close()">Скасувати</button>
        </form>
    </dialog>
    <footer>
        <p>Виконано в рамках четвертої лабораторної роботи</p>
        <div class="file-actions">
            <label class="file-button">
                Імпорт JSON
                <input type="file" accept=".json" onchange="importData(this)" aria-label="Імпорт JSON">
            </label>
            <button class="file-button" type="button" onclick="exportData()">Експорт JSON</button>
        </div>
        
    </footer>
</body>
</html>
